name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'

      - name: Repository safety checks
        shell: pwsh
        run: ./build/Check-Repository.ps1

      - name: Build Agent and Setup
        shell: pwsh
        run: ./build/Build-Release.ps1

      - name: Upload unsigned CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tsd-support-unsigned-ci
          path: |
            artifacts/agent-unsigned/TsdSupportAgent.exe
            artifacts/setup-unsigned/TSD-Support-Setup.exe
            artifacts/SHA256SUMS.txt
          retention-days: 7
